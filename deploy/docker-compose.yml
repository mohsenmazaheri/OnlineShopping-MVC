# One shop = one copy of this stack (PostgreSQL + API + web).
#   cp deploy/.env.example deploy/.env    # then edit the values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only the web container is published; put a TLS reverse proxy (e.g. deploy/nginx.conf) in front of it.
name: onlineshop

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlineshop}
      POSTGRES_USER: ${POSTGRES_USER:-onlineshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: ${REGISTRY:-onlineshop}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-onlineshop};Username=${POSTGRES_USER:-onlineshop};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Database__AdminEmail: ${ADMIN_EMAIL:-}
      Database__AdminPassword: ${ADMIN_PASSWORD:-}
      Store__Name: ${STORE_NAME:-Online Shop}
      Store__Locales: ${STORE_LOCALES:-fa,en}
      Store__DefaultLocale: ${DEFAULT_LOCALE:-fa}
      # Links in emails and the only origin allowed to send state-changing requests (CSRF check).
      Store__PublicUrl: ${SITE_URL:?Set SITE_URL in deploy/.env}
      Store__PhoneRegion: ${PHONE_REGION:-IR}
      Auth__EmailSignUp: ${AUTH_EMAIL_SIGN_UP:-true}
      Auth__PhoneSignUp: ${AUTH_PHONE_SIGN_UP:-true}
      # Only for a plain-HTTP test instance set this to false (cookies would otherwise not be sent).
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-true}
      Email__Delivery: ${EMAIL_DELIVERY:-Smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@localhost}
      Email__FromName: ${STORE_NAME:-Online Shop}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      # The API is reachable only from the web container on this private network, so it may trust
      # X-Forwarded-For; otherwise every visitor would share the web container's rate-limit bucket.
      ReverseProxy__TrustForwardedHeadersFromAnyHost: "true"
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: ${REGISTRY:-onlineshop}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8080
      SITE_URL: ${SITE_URL:?Set SITE_URL in deploy/.env}
      SEO_ALLOW_INDEXING: ${SEO_ALLOW_INDEXING:-false}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
