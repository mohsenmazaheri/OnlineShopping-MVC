name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build, tests, vulnerability scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: true
      # Integration tests create and drop their own databases on this server.
      INTEGRATIONTESTS__ADMINCONNECTION: Host=localhost;Port=5432;Database=postgres;Username=ci;Password=ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore OnlineShop.sln
      - run: dotnet build OnlineShop.sln -c Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code -- apps/web/openapi
      - name: Migrations match the model
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/OnlineShop.Infrastructure.Migrations.PostgreSql
          --startup-project src/OnlineShop.Api --no-build --configuration Release
        env:
          ConnectionStrings__Default: Host=localhost;Database=unused;Username=ci;Password=ci-only-password
      - run: dotnet test OnlineShop.sln -c Release --no-build --logger "trx" --collect "XPlat Code Coverage"
      - name: No vulnerable NuGet packages
        run: |
          dotnet list OnlineShop.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    name: Next.js lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types are generated from the current OpenAPI document
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds without a running API: nothing shop-specific is baked into the image.
      - run: npm run build
      - name: No high-severity vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/onlineshop-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/onlineshop-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/onlineshop-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/onlineshop-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
